[metadata]
name = t1000-control
version = 0.1.0
description = Modular T1000 control calculations and ROS 2 adapters

[options]
python_requires = >=3.10
install_requires =
    numpy>=1.24.0
packages = find:

[options.packages.find]
include = t1000_control*

[options.extras_require]
inference = onnxruntime>=1.23.0

[options.entry_points]
console_scripts =
    t1000-control = t1000_control.__main__:main
    t1000-lio-bridge = t1000_control.ros.lio_px4_bridge:main
    t1000-lio-preflight = t1000_control.lio.preflight:main
